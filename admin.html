<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haile Hotel Manager</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login"><form onsubmit="login(event)"><h2>Manager Login</h2><p>Haile Hotel Sodo</p><input id="email" type="email" placeholder="Manager email" required><input id="password" type="password" placeholder="Password" required><button type="submit">Sign In</button><small id="loginError"></small></form></div>
<div id="dashboard">
<header><b>HAILE HOTEL</b><span>SODO · MENU MANAGER</span><a href="index.html">View Menu</a><button onclick="logout()">Logout</button></header><main><div class="title"><div><h1>Menu Manager</h1><p>Add, edit and delete menu items.</p></div><button onclick="openEditor()">+ Add Food</button></div><div class="stats"><b id="count"></b> Menu Items <b id="cats"></b> Categories</div><input id="search" placeholder="Search items..."><div id="list"></div></main><div id="editor"><form onsubmit="saveItem(event)"><button type="button" onclick="closeEditor()">×</button><h2 id="et">Add Food</h2><input id="id" type="hidden"><label>Name<input id="name" required></label><label>Category<input id="category" required></label><label>Price ETB<input id="price" type="number" step=".01" required></label><label>Description<textarea id="desc"></textarea></label><label>Ingredients (comma separated)<input id="ing"></label><label>Photo / image class<input id="image" placeholder="e.g. chicken"></label><label><input id="available" type="checkbox" checked> Available to customers</label><label>Vitamins & Minerals<input id="vit" placeholder="e.g. Vitamin A, Vitamin C, Iron"></label><div class="two"><label>Calories<input id="cal"></label><label>Protein<input id="pro"></label><label>Carbs<input id="carb"></label><label>Fat<input id="fat"></label><label>Fiber<input id="fib"></label></div><button type="submit">Save Food</button><button type="button" id="del" onclick="deleteItem()">Delete</button></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
