<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haile Hotel Manager</title><link rel="stylesheet" href="admin.css"></head><body><header><b>HAILE HOTEL</b><span>SODO · MENU MANAGER</span><a href="index.html">View Menu</a></header><main><div class="title"><div><h1>Menu Manager</h1><p>Add, edit and delete menu items.</p></div><button onclick="openEditor()">+ Add Food</button></div><div class="stats"><b id="count"></b> Menu Items <b id="cats"></b> Categories</div><input id="search" placeholder="Search items..."><div id="list"></div></main><div id="editor"><form onsubmit="saveItem(event)"><button type="button" onclick="closeEditor()">×</button><h2 id="et">Add Food</h2><input id="id" type="hidden"><label>Name<input id="name" required></label><label>Category<input id="category" required></label><label>Price ETB<input id="price" type="number" step=".01" required></label><label>Description<textarea id="desc"></textarea></label><label>Ingredients (comma separated)<input id="ing"></label><label>Vitamins & Minerals<input id="vit" placeholder="e.g. Vitamin A, Vitamin C, Iron"></label><div class="two"><label>Calories<input id="cal"></label><label>Protein<input id="pro"></label><label>Carbs<input id="carb"></label><label>Fat<input id="fat"></label><label>Fiber<input id="fib"></label></div><button type="submit">Save Food</button><button type="button" id="del" onclick="deleteItem()">Delete</button></form></div><script src="admin.js"></script></body></html>
